name: movana
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: movana
      POSTGRES_USER: movana
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - movana_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movana -d movana"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  movana:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: movana
      DB_USER: movana
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MEDIA_ROOT: /media
    ports:
      - "${MOVANA_BIND_IP:-127.0.0.1}:${MOVANA_PORT:-8088}:8080"
    volumes:
      - ${MEDIA_PATH:?Set MEDIA_PATH in .env}:/media:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live',timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  movana_postgres:
